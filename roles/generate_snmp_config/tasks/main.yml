---

- name: Generate SNMP Config
  block:
    - name: Install gnu-sed(for Makefile)
      community.general.homebrew:
        name:
          - gnu-sed
        state: upgraded

    - name: Checkout snmp_exporter repository
      when: not ansible_check_mode
      ansible.builtin.git:
        repo: https://github.com/prometheus/snmp_exporter.git
        dest: "{{ generate_snmp_config_tmp_dir }}"
        version: main
        force: true
      register: generate_snmp_config_repo

    - name: Insert temporary sed alias
      when: not ansible_check_mode and generate_snmp_config_repo.before != generate_snmp_config_repo.after
      ansible.builtin.file:
        src: /opt/homebrew/bin/gsed
        dest: /opt/homebrew/bin/sed
        state: link

    - name: Download Common mib file with Makefile
      when: not ansible_check_mode and generate_snmp_config_repo.before != generate_snmp_config_repo.after
      community.general.make:
        chdir: "{{ generate_snmp_config_tmp_dir }}/generator"
        target: mibs

    - name: Remove temporary sed alias
      when: not ansible_check_mode and generate_snmp_config_repo.before != generate_snmp_config_repo.after
      ansible.builtin.file:
        path: /opt/homebrew/bin/sed
        state: absent

    - name: Create generator.yml
      when: not ansible_check_mode
      ansible.builtin.template:
        src: generator.yml.j2
        dest: "{{ generate_snmp_config_tmp_dir }}/generator/generator.yml"
        mode: '0644'

    - name: Run generate script in Container
      when: not ansible_check_mode
      community.general.make:
        chdir: "{{ generate_snmp_config_tmp_dir }}/generator"
        target: docker-generate
      environment:
        DOCKER_HOST: "unix://{{ ansible_facts['env']['HOME'] }}/.lima/docker/sock/docker.sock"
        PWD: "{{ generate_snmp_config_tmp_dir }}/generator"

    - name: Create a config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/grafstation/configs"
        state: directory
        mode: '0755'

    - name: Copy snmp.yml to snmp-exporter config dir
      when: not ansible_check_mode
      ansible.builtin.copy:
        remote_src: true
        src: "{{ generate_snmp_config_tmp_dir }}/generator/snmp.yml"
        dest: "{{ ansible_facts['env']['HOME'] }}/grafstation/configs/snmp.yml"
        mode: '0644'

  always:
    # - name: Remove temp directory
    #   ansible.builtin.file:
    #     path: "{{ generate_snmp_config_tmp_dir }}"
    #     state: absent

    - name: Remove temporary sed alias
      when: not ansible_check_mode and generate_snmp_config_repo.before != generate_snmp_config_repo.after
      ansible.builtin.file:
        path: /opt/homebrew/bin/sed
        state: absent
